[project]
name = "lakehouse-jobs"
version = "0.1.0"
description = "Spark jobs for the Polaris + Iceberg lakehouse demo"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pyspark==4.1.4", "pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
